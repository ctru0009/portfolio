name: Deploy Portfolio to Github Pages
on:
  push:
    branches:
      - main
permissions:
  contents: write
  
env:
  CUSTOM_DOMAIN: "www.congchuongtruong.net"
  VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
  
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install
        
      - name: Build Project
        run: npm run build

        
      - name: Add CNAME file
        run: echo "${{ env.CUSTOM_DOMAIN }}" > dist/CNAME
        
      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: .
          clean: true