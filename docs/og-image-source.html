<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-image source</title>
    <style>
      @font-face {
        font-family: "Departure";
        src: url("../src/assets/fonts/DepartureMono-Regular.woff2") format("woff2");
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: Departure, ui-monospace, Menlo, Consolas, monospace;
        background-color: #d8d8d8;
        background-image: radial-gradient(#999 1px, transparent 1px);
        background-size: 4px 4px;
        color: #111;
        padding: 42px;
      }
      .window {
        width: 100%;
        height: 100%;
        border: 4px solid #111;
        background: #fff;
        box-shadow: 12px 12px 0 #111;
        display: flex;
        flex-direction: column;
      }
      .titlebar {
        height: 58px;
        flex: none;
        border-bottom: 4px solid #111;
        background: repeating-linear-gradient(to bottom, #fff 0 4px, #111 4px 6px);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        position: relative;
      }
      .box {
        width: 22px;
        height: 22px;
        border: 4px solid #111;
        background: #fff;
        flex: none;
      }
      .titlebar .box:last-child {
        margin-left: auto;
      }
      .title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        padding: 2px 16px;
        font-size: 20px;
      }
      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 20px;
        padding: 20px 60px;
      }
      h1 {
        font-size: 66px;
        font-weight: normal;
        letter-spacing: -1px;
      }
      .role {
        font-size: 26px;
        text-transform: uppercase;
        letter-spacing: 3px;
      }
      .sub {
        font-size: 22px;
        color: #444;
      }
      .url {
        margin-top: 12px;
        padding-top: 16px;
        border-top: 3px solid #111;
        font-size: 19px;
      }
      .meta {
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <span class="box"></span>
        <span class="box"></span>
        <span class="title">congchuongtruong.net</span>
        <span class="box"></span>
      </div>
      <div class="body">
        <h1>Cong Chuong Truong</h1>
        <div class="role">Software Engineer</div>
        <div class="sub">Building reliable AI-integrated products.</div>
        <div class="url">congchuongtruong.net</div>
        <div class="meta">Melbourne · Open to full-time roles</div>
      </div>
    </div>
  </body>
</html>
